    <h2>DePIN节点租赁</h2>
    <p>面向算力提供者与需求者打造去中心化节点租赁体系，用户支付AIToken租用AI算力节点，算力提供者质押代币接入网络赚取分红。</p>
    <h3>核心规则</h3>
    <p>1. 租户：支付代币租用GPU节点，用于批量AI绘图、大模型运行；</p>
    <p>2. 节点提供者：质押代币上线算力，按算力贡献每日瓜分平台手续费；</p>
    <p>3. 手续费分配：一部分划入质押矿池，一部分进入国库用于代币回购销毁。</p>
